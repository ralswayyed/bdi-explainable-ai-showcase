<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Historical 2020 explanation pattern distribution</title>
  <desc id="desc">Bar chart showing Justification at 43 percent, Justification plus Transparency at 40 percent, Transparency at 16 percent, and Relevance at 1 percent in the controlled thesis evaluation.</desc>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#0f172a}.title{font-size:30px;font-weight:700}.subtitle{font-size:16px;fill:#475569}.axis{font-size:14px;fill:#64748b}.label{font-size:17px;font-weight:600}.value{font-size:25px;font-weight:700}</style>
  <rect width="1200" height="600" rx="28" fill="#f8fafc"/>
  <text x="70" y="70" class="title">Historical explanation-pattern distribution</text>
  <text x="70" y="102" class="subtitle">Controlled 2020 thesis evaluation: 48 queries across four floor-plan fingerprint types</text>
  <line x1="130" y1="470" x2="1130" y2="470" stroke="#94a3b8" stroke-width="2"/>
  <line x1="130" y1="370" x2="1130" y2="370" stroke="#e2e8f0" stroke-width="2"/><line x1="130" y1="270" x2="1130" y2="270" stroke="#e2e8f0" stroke-width="2"/><line x1="130" y1="170" x2="1130" y2="170" stroke="#e2e8f0" stroke-width="2"/>
  <text x="100" y="475" text-anchor="end" class="axis">0%</text><text x="100" y="375" text-anchor="end" class="axis">15%</text><text x="100" y="275" text-anchor="end" class="axis">30%</text><text x="100" y="175" text-anchor="end" class="axis">45%</text>
  <rect x="210" y="183" width="155" height="287" rx="12" fill="#2563eb"/><text x="287" y="165" text-anchor="middle" class="value">43%</text><text x="287" y="510" text-anchor="middle" class="label">Justification</text>
  <rect x="445" y="203" width="155" height="267" rx="12" fill="#16a34a"/><text x="522" y="185" text-anchor="middle" class="value">40%</text><text x="522" y="510" text-anchor="middle" class="label">Justification +</text><text x="522" y="533" text-anchor="middle" class="label">Transparency</text>
  <rect x="680" y="363" width="155" height="107" rx="12" fill="#d97706"/><text x="757" y="345" text-anchor="middle" class="value">16%</text><text x="757" y="510" text-anchor="middle" class="label">Transparency</text>
  <rect x="915" y="463" width="155" height="7" rx="4" fill="#7c3aed"/><text x="992" y="445" text-anchor="middle" class="value">1%</text><text x="992" y="510" text-anchor="middle" class="label">Relevance</text>
  <text x="70" y="565" class="axis">Historical thesis finding only. It is not a present-day performance claim.</text>
</svg>
