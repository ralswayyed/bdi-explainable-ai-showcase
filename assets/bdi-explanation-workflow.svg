<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">BDI explanation workflow for architectural floor-plan retrieval</title>
  <desc id="desc">A query and retrieved floor plans move from the Belief agent through Desire and Intention agents to a user-facing explanation. Transparency, Justification, and Relevance patterns are selected during the workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#0f172a}.title{font-size:30px;font-weight:700}.subtitle{font-size:16px;fill:#475569}.label{font-size:20px;font-weight:700}.copy{font-size:15px;fill:#334155}.small{font-size:14px;fill:#475569}.node{stroke-width:2}.line{stroke:#475569;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <text x="60" y="70" class="title">BDI explanation workflow</text>
  <text x="60" y="102" class="subtitle">A traceable explanation layer for case-based architectural floor-plan retrieval</text>
  <rect x="60" y="192" width="180" height="130" rx="18" fill="#fff" stroke="#64748b" class="node"/>
  <text x="150" y="230" text-anchor="middle" class="label">Input</text>
  <text x="150" y="258" text-anchor="middle" class="copy">Query floor plan</text>
  <text x="150" y="282" text-anchor="middle" class="copy">Retrieved results</text>
  <rect x="310" y="160" width="190" height="190" rx="18" fill="#dbeafe" stroke="#2563eb" class="node"/>
  <text x="405" y="205" text-anchor="middle" class="label">Belief</text>
  <text x="405" y="235" text-anchor="middle" class="copy">Receives request</text>
  <text x="405" y="258" text-anchor="middle" class="copy">Identifies fingerprint</text>
  <text x="405" y="281" text-anchor="middle" class="copy">Returns explanation</text>
  <rect x="570" y="160" width="190" height="190" rx="18" fill="#dcfce7" stroke="#16a34a" class="node"/>
  <text x="665" y="205" text-anchor="middle" class="label">Desire</text>
  <text x="665" y="235" text-anchor="middle" class="copy">Selects patterns</text>
  <text x="665" y="258" text-anchor="middle" class="copy">Coordinates progress</text>
  <rect x="830" y="160" width="190" height="190" rx="18" fill="#fef3c7" stroke="#d97706" class="node"/>
  <text x="925" y="205" text-anchor="middle" class="label">Intention</text>
  <text x="925" y="235" text-anchor="middle" class="copy">Applies plan</text>
  <text x="925" y="258" text-anchor="middle" class="copy">Generates text</text>
  <line x1="240" y1="257" x2="310" y2="257" class="line"/><line x1="500" y1="257" x2="570" y2="257" class="line"/><line x1="760" y1="257" x2="830" y2="257" class="line"/>
  <rect x="1025" y="192" width="125" height="130" rx="18" fill="#ede9fe" stroke="#7c3aed" class="node"/>
  <text x="1088" y="230" text-anchor="middle" class="label">Output</text>
  <text x="1088" y="258" text-anchor="middle" class="copy">User-facing</text>
  <text x="1088" y="282" text-anchor="middle" class="copy">explanation</text>
  <line x1="1020" y1="257" x2="1025" y2="257" class="line"/>
  <text x="60" y="405" class="label">Explanation patterns</text>
  <rect x="60" y="426" width="260" height="48" rx="12" fill="#dbeafe"/><text x="190" y="457" text-anchor="middle" class="small">Transparency · how it was reached</text>
  <rect x="350" y="426" width="285" height="48" rx="12" fill="#dcfce7"/><text x="492" y="457" text-anchor="middle" class="small">Justification · why it is suitable</text>
  <rect x="665" y="426" width="355" height="48" rx="12" fill="#fef3c7"/><text x="842" y="457" text-anchor="middle" class="small">Relevance · when input is insufficient</text>
</svg>
